# Undertow, the SurfOS web browser: settings (docs/UNDERTOW.md)
#
# rtc_offset_minutes: how far the hardware clock is from UTC, in minutes, -840 to 840.
# HTTPS checks certificate dates against UTC = the clock's reading - this offset.
# 0 when the clock keeps UTC (QEMU's does); -300 for a clock on US Central Daylight
# Time (UTC-5), -360 on Central Standard Time. In the browser, "clock" shows the time
# it uses and "clock YYYY-MM-DD HH:MM:SS" sets UTC for one session.
rtc_offset_minutes=0
#
# host=NAME ADDRESS gives NAME a fixed IPv4 address instead of asking DNS, e.g.
# host=printer.home 10.0.0.20
#
# font: the base size of the text in wundertow, the browser in a window: 8x16, 12x24 or
# 16x32. Without it, the desktop's font, 8x16. Undertow itself has no use for it. E.g.
# font=12x24
