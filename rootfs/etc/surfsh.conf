# /initrd/etc/surfsh.conf: the settings surfsh, the SurfOS shell, starts with.
# Lines are "key = value"; # starts a comment. The keys are those of the set
# command, which changes them while the shell runs (set alone lists them).
# The values below are the defaults.

# The prompt's symbols: the triangle between directories and the wave (on), or
# their ASCII stand-ins (off). On only where the console draws UTF-8.
#prompt.unicode = on

# The SurfOS colours: the prompt light blue, a failed command's mark light red,
# typed text teal (on), or no colours at all (off).
#prompt.color = on

# How many directories the prompt shows at most, the ellipsis for the hidden
# ones included: 2 to 16.
#prompt.max_depth = 5
