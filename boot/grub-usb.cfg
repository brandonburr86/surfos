# SurfOS USB image: the GRUB menu (tools/mkusb.py copies this to /boot/grub/grub.cfg).
#
# GRUB runs on the firmware's text console, so it needs no graphics terminal or font.
# Multiboot 2 hands the kernel the firmware's framebuffer in the mode it is already in;
# profile=laptop tells the kernel it is on real UEFI hardware (see docs/USB-BOOT.md).
# shell=kernel (10/6/26) gives every console the kernel's own ring-0 shell instead of
# the user shell, surfsh. The troubleshooting entry stays second and the kernel shell
# third: tools/qemu-usb.py picks them with the Down key.

set timeout=5
set default=0

menuentry "SurfOS" {
    echo "Loading SurfOS (/boot/surfos.bin) ..."
    multiboot2 /boot/surfos.bin profile=laptop
    echo "Loading the initrd (/boot/initrd.tar) ..."
    module2 /boot/initrd.tar initrd.tar
    echo "Starting SurfOS ..."
    boot
}

menuentry "SurfOS (troubleshooting: local APIC timer, polled keyboard)" {
    echo "Loading SurfOS with timer=lapic kbd=poll ..."
    multiboot2 /boot/surfos.bin profile=laptop timer=lapic kbd=poll
    module2 /boot/initrd.tar initrd.tar
    boot
}

menuentry "SurfOS (kernel shell)" {
    echo "Loading SurfOS with shell=kernel ..."
    multiboot2 /boot/surfos.bin profile=laptop shell=kernel
    module2 /boot/initrd.tar initrd.tar
    boot
}

menuentry "SurfOS (USB controller off: no USB network adapter, no USB sticks)" {
    echo "Loading SurfOS with usb=off ..."
    multiboot2 /boot/surfos.bin profile=laptop usb=off
    module2 /boot/initrd.tar initrd.tar
    boot
}

menuentry "UEFI firmware setup" {
    fwsetup
}

menuentry "Restart" {
    reboot
}

menuentry "Power off" {
    halt
}
