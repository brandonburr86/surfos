# SurfOS USB image: the GRUB menu (tools/mkusb.py copies this to /boot/grub/grub.cfg).
#
# GRUB runs on the firmware's text console, so it needs no graphics terminal or font.
# Multiboot 2 hands the kernel the firmware's framebuffer in the mode it is already in;
# profile=laptop tells the kernel it is on real UEFI hardware (see docs/USB-BOOT.md).
# shell=kernel (10/6/26) gives every console the kernel's own ring-0 shell instead of
# the user shell, surfsh. The troubleshooting entry stays second and the kernel shell
# third: tools/qemu-usb.py picks them with the Down key.
#
# 10/9/26 (the development loop, docs/USB-BOOT.md section 13): when another disk, the
# data stick, holds /surfos-dev/surfos.bin and /surfos-dev/initrd.tar (tools/devloop.py
# pushes them there over the network), a first entry boots that build with the kernel
# word autonet (the network and telnetd come up by themselves) and is the default.
# Without such a disk the menu is exactly as it was, entry for entry, and nothing is
# printed. The disks are looked at one by one with test -f, which says nothing when a
# disk, a partition or a file is not there (a search that finds nothing prints an
# error): the first partition of an MBR or a GPT disk, or a disk with no partition
# table. The empty /boot/grub/x86_64-efi/fs.lst (tools/mkusb.py) keeps GRUB from
# looking for file system modules, which are not on the drive, when a disk is not FAT.

set timeout=5
set default=0

set surfos_devbuild=
regexp --set 1:surfos_boot_disk '^([^,]+)' "$root"
for surfos_disk in hd0 hd1 hd2 hd3 hd4 hd5 hd6 hd7 hd8 hd9; do
    if [ "$surfos_disk" != "$surfos_boot_disk" ]; then
        for surfos_part in "$surfos_disk,msdos1" "$surfos_disk,gpt1" "$surfos_disk"; do
            if [ -z "$surfos_devbuild" ]; then
                if [ -f "($surfos_part)/surfos-dev/surfos.bin" ]; then
                    if [ -f "($surfos_part)/surfos-dev/initrd.tar" ]; then
                        set surfos_devbuild="$surfos_part"
                    fi
                fi
            fi
        done
    fi
done
if [ -n "$surfos_devbuild" ]; then
    export surfos_devbuild
    menuentry "SurfOS (development build from the data stick)" {
        echo "Loading the development build ($surfos_devbuild)/surfos-dev/surfos.bin ..."
        multiboot2 ($surfos_devbuild)/surfos-dev/surfos.bin profile=laptop autonet
        echo "Loading its initrd ($surfos_devbuild)/surfos-dev/initrd.tar ..."
        module2 ($surfos_devbuild)/surfos-dev/initrd.tar initrd.tar
        echo "Starting SurfOS ..."
        boot
    }
fi

menuentry "SurfOS" {
    echo "Loading SurfOS (/boot/surfos.bin) ..."
    multiboot2 /boot/surfos.bin profile=laptop
    echo "Loading the initrd (/boot/initrd.tar) ..."
    module2 /boot/initrd.tar initrd.tar
    echo "Starting SurfOS ..."
    boot
}

menuentry "SurfOS (troubleshooting: local APIC timer, polled keyboard)" {
    echo "Loading SurfOS with timer=lapic kbd=poll ..."
    multiboot2 /boot/surfos.bin profile=laptop timer=lapic kbd=poll
    module2 /boot/initrd.tar initrd.tar
    boot
}

menuentry "SurfOS (kernel shell)" {
    echo "Loading SurfOS with shell=kernel ..."
    multiboot2 /boot/surfos.bin profile=laptop shell=kernel
    module2 /boot/initrd.tar initrd.tar
    boot
}

menuentry "SurfOS (USB controller off: no USB network adapter, no USB sticks)" {
    echo "Loading SurfOS with usb=off ..."
    multiboot2 /boot/surfos.bin profile=laptop usb=off
    module2 /boot/initrd.tar initrd.tar
    boot
}

menuentry "UEFI firmware setup" {
    fwsetup
}

menuentry "Restart" {
    reboot
}

menuentry "Power off" {
    halt
}
