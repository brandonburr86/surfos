# SurfOS USB bootstrap: built into /EFI/BOOT/BOOTX64.EFI by tools/mkusb.py
# (grub-mkstandalone puts it at (memdisk)/boot/grub/grub.cfg).
#
# Find the FAT32 partition this loader was started from ($cmdpath is something like
# "(hd1,gpt1)/EFI/BOOT") and hand over to its /boot/grub/grub.cfg. If that partition
# does not hold SurfOS, look for /boot/surfos.bin on the other disks.
#
# 10/17/26 (one stick): the partition may be the image's (GPT, SURFOSUSB) or any FAT32
# stick the files of build/usb/stick/ were copied onto ("(hd0,msdos1)/EFI/BOOT"); the
# message below says both ways.

set surfos_dev=
set surfos_root=
regexp --set 1:surfos_dev '^\(([^)]+)\)' "$cmdpath"
if [ -n "$surfos_dev" -a -f "($surfos_dev)/boot/surfos.bin" ]; then
    set surfos_root="$surfos_dev"
else
    echo "SurfOS: the boot partition ($cmdpath) has no /boot/surfos.bin; searching all disks"
    search --no-floppy --set=surfos_root --file /boot/surfos.bin
fi

if [ -n "$surfos_root" -a -f "($surfos_root)/boot/grub/grub.cfg" ]; then
    set root="$surfos_root"
    set prefix="($surfos_root)/boot/grub"
    configfile "($surfos_root)/boot/grub/grub.cfg"
fi

echo "SurfOS: /boot/surfos.bin and /boot/grub/grub.cfg were not found."
echo "Either write the .img file to the USB drive with a raw image writer (the .img"
echo "itself copied onto a drive as a file does not work), or copy the files in"
echo "build/usb/stick/, folders and all, onto a FAT32 stick (docs/USB-BOOT.md section 14)."
echo "Press a key for the GRUB command line."
sleep --interruptible 300
