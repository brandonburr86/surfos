set timeout=1
set default=0

menuentry "SurfOS" {
    multiboot /boot/surfos.bin
    module /boot/initrd.tar initrd.tar
    boot
}

# 10/6/26: the kernel's own ring-0 shell on every console instead of the user shell, surfsh
menuentry "SurfOS (kernel shell)" {
    multiboot /boot/surfos.bin shell=kernel
    module /boot/initrd.tar initrd.tar
    boot
}
