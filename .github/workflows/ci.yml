# Boot-test every push: build at -O0 and -O2, run the serial smoke test under QEMU,
# run the host unit tests, and make sure the GRUB ISO still builds.
name: ci

on:
  push:
  pull_request:

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc-multilib libc6-dev-i386 nasm qemu-system-x86 python3 \
            grub-pc-bin grub-common xorriso mtools

      - name: Unit tests (host)
        run: make unittest

      - name: Build and smoke test at -O0 and -O2
        run: make test-all

      - name: GRUB ISO
        run: make iso

      - name: Keep the kernels and ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfos-${{ github.sha }}
          path: |
            build/O0/surfos.bin
            build/O2/surfos.bin
            build/O0/surfos.iso
            build/O0/surfos.sym
          if-no-files-found: ignore
