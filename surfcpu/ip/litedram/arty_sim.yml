# SurfCPU: the same LiteDRAM controller for simulation (litedram_gen --sim replaces the PHY with
# LiteDRAM's SDRAMPHYModel, a behavioural DRAM; no vendor primitives). File: arty_sim.yml
# Date: 10/15/26 (SurfCPU). No calibration CPU: the model needs no calibration, the DFI is in
# hardware control after reset, and the user port is not blocked until init_done, so the
# testbench can use it at once. Used by sim/ddr/ to test the bridge and the LiteDRAM adapter
# against LiteDRAM's real controller, crossbar and native port.
{
    "speedgrade": -1,
    "cpu":        None,
    "memtype":    "DDR3",
    "cmd_latency":     0,
    "sdram_module":    "MT41K128M16",
    "sdram_module_nb": 2,
    "sdram_rank_nb":   1,
    "sdram_phy":       "A7DDRPHY",
    "rtt_nom": "60ohm",
    "rtt_wr":  "60ohm",
    "ron":     "34ohm",
    "input_clk_freq":   100e6,
    "sys_clk_freq":     100e6,
    "iodelay_clk_freq": 200e6,
    "cmd_buffer_depth": 16,
    "user_ports": {
        "native_0": {
            "type": "native",
            "block_until_ready": False,
        },
    },
}
