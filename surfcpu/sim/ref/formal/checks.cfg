# SurfCPU riscv-formal configuration (template)
# File: checks.cfg Date: 10/15/26 (SurfCPU)
# tools/rvformal.py fills in @DEFINES@, @FILTERS@ and @FILES@ and copies the result into
# riscv-formal's cores/surfcpu/. The core is checked as RV32IM with one retirement per cycle
# (ISA.md section 5: NRET = 1). Depths are bounded-model-checking cycles after reset.
# Solver: ABC's bmc3 (yosys-abc), which proves the instruction checks in 5-21 s each on the
# core; z3 did not finish insn_lw in 55 minutes, and the container's boolector 1.5.118 crashes
# in yosys-smtbmc 0.52 with and without --unroll (seen 2026-10-15). tools/rvformal.py drops
# sby's "skip" option, which the abc engine does not take, and replays failures with z3.
# Addresses from 0xF0000000 up are invalid: the bus slaves answer them with rsp_err and the
# checks expect an access fault there (surfbus_formal_slave.sv).
# Run times with bmc3 on the core (docs/evidence/verif/formal.txt): every check below within
# 22 s except pc_fwd (17-19 minutes at depth 20; at 25 it did not finish in 40 minutes) and reg
# (did not finish: 40 minutes at depth 25, 25 minutes at 20).

[options]
isa rv32im
nret 1
solver bmc3

[depth]
insn            20
reg        5    25
pc_fwd     5    20
pc_bwd     5    25
unique     1  5 25
causal     5    25
liveness   1  5 30
ill             20

[sort]
reg_ch0

[defines]
@DEFINES@
`define SURFCPU_FORMAL_BUS_ASSERTS
`define RISCV_FORMAL_VALIDADDR(addr) ((addr) < 32'hF0000000)

[defines liveness]
`define SURFCPU_FORMAL_FAIRNESS

[filter-checks]
@FILTERS@

[verilog-files]
@FILES@
