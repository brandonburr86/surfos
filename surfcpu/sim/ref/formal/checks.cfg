# SurfCPU riscv-formal configuration (template)
# File: checks.cfg Date: 10/15/26 (SurfCPU)
# tools/rvformal.py fills in @DEFINES@, @FILTERS@ and @FILES@ and copies the result into
# riscv-formal's cores/surfcpu/. The core is checked as RV32IM with one retirement per cycle
# (ISA.md section 5: NRET = 1). Depths are bounded-model-checking cycles after reset; raise
# them once the core's pipeline depth and bus latencies are known. Solver z3: the container's
# boolector 1.5.118 crashes under yosys-smtbmc 0.52's --unroll (seen 2026-10-15).

[options]
isa rv32im
nret 1
solver z3

[depth]
insn            20
reg        5    25
pc_fwd     5    25
pc_bwd     5    25
unique     1  5 25
causal     5    25
liveness   1  5 30
ill             20

[sort]
reg_ch0

[defines]
@DEFINES@
`define SURFCPU_FORMAL_BUS_ASSERTS

[defines liveness]
`define SURFCPU_FORMAL_FAIRNESS

[filter-checks]
@FILTERS@

[verilog-files]
@FILES@
