offset = 0x104C
access = "rw"
desc = "sdram.dfii_pi3_command: the command bits of phase 3's next injected command."
fields = [
  { name = "CS", bits = "0", desc = "chip select" },
  { name = "WE", bits = "1", desc = "WE (active: the command's WE# is low)" },
  { name = "CAS", bits = "2", desc = "CAS (active: CAS# low)" },
  { name = "RAS", bits = "3", desc = "RAS (active: RAS# low)" },
