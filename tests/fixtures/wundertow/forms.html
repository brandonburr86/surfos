<!DOCTYPE html>
<title>Forms</title>
<form action="/search" method="get">
  <p>Search: <input type="text" name="q" placeholder="Words to find"> <input type="submit" value="Go">
  <p><input type="checkbox" name="a" checked> Checked <input type="checkbox" name="b"> Not checked
  <p><input type="radio" name="r" value="1" checked> One <input type="radio" name="r" value="2"> Two
  <p>Password: <input type="password" value="secret12"> File: <input type="file">
  <p><select name="s"><option>Red<option selected>Green<option>Blue</select>
  <p><textarea rows="3">Some text
in a box</textarea>
  <p><button type="button">A <b>button</b></button> <input type="reset"> <input type="image" alt="Send">
  <input type="hidden" name="token" value="never-shown">
</form>
